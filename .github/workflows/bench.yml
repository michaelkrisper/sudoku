name: benchmark

# Correctness runs in ci on every push; the benchmark itself is deliberately manual.
# A full measured run takes the better part of an hour, and its numbers are only
# meaningful when nothing else is competing for the runner. The results (README,
# charts, JSON) come back as an artifact: main only takes changes through pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains
      - name: Verify every implementation
        run: python3 bench/run.py --verify
      - name: Check the I/O contract edge cases
        run: tools/contract_test.sh
      - name: Check every implementation against reference solutions
        run: TIMEOUT=60 tools/crosscheck.sh easy medium

  bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains

      - name: Record runner hardware
        run: |
          grep -m1 'model name' /proc/cpuinfo
          echo "cores: $(nproc)"
          gcc --version | head -1
          clang --version | head -1
          go version
          rustc --version
          node --version
          nasm -v

      - name: Build and benchmark
        run: |
          python3 bench/run.py
          cp "$(ls -t results/*.json | head -1)" results/github-runner.json
          python3 bench/run.py --readme results/github-runner.json

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            README.md
            results/github-runner.json
            assets/*.png
