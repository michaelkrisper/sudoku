name: benchmark

# Correctness runs on every push; the benchmark itself is deliberately manual.
# A full measured run takes the better part of an hour, and its numbers are only
# meaningful when nothing else is competing for the runner.
on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchains
      - name: Verify every implementation
        run: python3 bench/run.py --verify
      - name: Check the I/O contract edge cases
        run: tools/contract_test.sh
      - name: Check every implementation against reference solutions
        run: TIMEOUT=60 tools/crosscheck.sh easy medium

  bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchains

      - name: Record runner hardware
        run: |
          grep -m1 'model name' /proc/cpuinfo
          echo "cores: $(nproc)"
          gcc --version | head -1
          clang --version | head -1
          go version
          rustc --version
          node --version
          nasm -v

      - name: Build and benchmark
        run: |
          python3 bench/run.py
          cp "$(ls -t results/*.json | head -1)" results/github-runner.json
          python3 bench/run.py --readme results/github-runner.json

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/github-runner.json
            assets/*.png

      - name: Commit results
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md assets results/github-runner.json
          git diff --quiet --cached || git commit -m "Benchmark results from GitHub runner"
          git push
