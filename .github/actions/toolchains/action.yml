name: toolchains
description: Install every compiler and runtime the benchmark builds against.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq nasm clang time   # `time` for the cost measurements
        python3 -m pip install --quiet -r requirements-dev.txt

    - uses: actions/setup-go@v7
      with:
        go-version: stable

    - uses: actions/setup-node@v7
      with:
        node-version: '26'
